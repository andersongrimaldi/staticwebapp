<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Página Estática</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f6f9;
            color: #1f2937;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background: #ffffff;
            max-width: 600px;
            width: 100%;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            text-align: center;
        }
        .badge {
            display: inline-block;
            background-color: #e0f2fe;
            color: #0369a1;
            font-size: 0.85rem;
            font-weight: 600;
            padding: 6px 14px;
            border-radius: 999px;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 2rem;
            margin-bottom: 16px;
            color: #111827;
        }
        p {
            font-size: 1.05rem;
            line-height: 1.6;
            color: #4b5563;
            margin-bottom: 28px;
        }
        .btn {
            display: inline-block;
            background-color: #0078d4;
            color: #ffffff;
            text-decoration: none;
            font-weight: 600;
            padding: 12px 24px;
            border-radius: 8px;
            transition: background-color 0.2s ease;
        }
        .btn:hover {
            background-color: #005a9e;
        }
        footer {
            margin-top: 32px;
            font-size: 0.85rem;
            color: #9ca3af;
        }
    </style>
</head>
<body>

    <main class="card">
        <span class="badge">● Online no Static Web App</span>
        <h1>Deploy realizado com sucesso!</h1>
        <p>
            Esta é uma página HTML estática simples hospedada na nuvem. Anderson Grimaldi test
            Você já pode editar este arquivo para adicionar seu próprio conteúdo, estilos e scripts.
        </p>
        <a href="#" class="btn" onclick="alert('Funcionando perfeitamente!'); return false;">
            Testar Interação
        </a>
        <footer>
            Hospedado via Azure Static Web Apps
        </footer>
    </main>

</body>
</html>
